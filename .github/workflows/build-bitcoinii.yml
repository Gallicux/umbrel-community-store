name: Build BitcoinII Core ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - "images/bitcoinii-core-31.1.0/**"
      - ".github/workflows/build-bitcoinii.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./images/bitcoinii-core-31.1.0
          platforms: linux/arm64
          push: true
          tags: ghcr.io/gallicux/bitcoinii-core:31.1.0
